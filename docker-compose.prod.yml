# Stack de production BDM — MySQL (pas Postgres pour l'instant), isolée des
# autres projets déjà présents sur ce VPS. Nginx du conteneur "web" n'est PAS
# exposé publiquement : il écoute sur 127.0.0.1 uniquement, le nginx déjà
# installé sur l'hôte fait le reverse-proxy public (comme pour les autres
# sites de ce serveur).
#
# Usage :
#   docker compose -f docker-compose.prod.yml --env-file .env.docker.prod up -d --build

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    volumes:
      - app_public:/var/www/html/public
      - storage_app:/var/www/html/storage/app/public
      - storage_logs:/var/www/html/storage/logs
      - ./.env.production:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [bdm_prod]
    restart: unless-stopped

  web:
    image: nginx:alpine
    volumes:
      - app_public:/var/www/html/public:ro
      - storage_app:/var/www/html/storage/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - app
    networks: [bdm_prod]
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bdm}
      MYSQL_USER: ${DB_USERNAME:-bdm}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [bdm_prod]
    restart: unless-stopped

networks:
  bdm_prod:

volumes:
  app_public:
  storage_app:
  storage_logs:
  db_data:
