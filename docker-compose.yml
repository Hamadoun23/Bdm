# Stack Docker locale : Laravel (Inertia/React) + Postgres (image Supabase) + Studio.
# N'affecte pas l'environnement XAMPP/MySQL existant.
#
# Usage :
#   cp .env.docker.example .env.docker   (une fois, puis ajuster les mots de passe)
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker exec app php artisan key:generate
#   docker compose --env-file .env.docker exec app php artisan migrate --seed
#   # --seed ne crée que les comptes admin (SoloAdminSeeder). Pour un jeu de
#   # données de démo complet (agences, commerciaux, campagne, ventes) :
#   docker compose --env-file .env.docker exec app php artisan db:seed --class=FreshMinimalSeeder
#   docker compose --env-file .env.docker exec app php artisan db:seed --class=ResetBusinessDataSeeder
#
# Studio (admin DB) : http://localhost:54323
# App (via nginx)   : http://localhost:8080
# Vite dev server   : http://localhost:5173

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - ./.env.docker:/var/www/html/.env
      - app_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks: [bdm]

  web:
    image: nginx:alpine
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app
    networks: [bdm]

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks: [bdm]

  db:
    image: supabase/postgres:latest
    # Image Supabase (pas un Postgres vanilla) : ships les rôles/extensions
    # attendus par Studio/postgres-meta. Épingler un tag précis avant la
    # phase VPS (cf. github.com/supabase/supabase/blob/master/docker/docker-compose.yml).
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bdm}
      POSTGRES_USER: ${POSTGRES_USER:-bdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdm} -d ${POSTGRES_DB:-bdm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bdm]

  meta:
    image: supabase/postgres-meta:latest
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-bdm}
      PG_META_DB_USER: ${POSTGRES_USER:-bdm}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    depends_on:
      db:
        condition: service_healthy
    networks: [bdm]

  studio:
    image: supabase/studio:latest
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      DEFAULT_ORGANIZATION_NAME: "GDA"
      DEFAULT_PROJECT_NAME: "Campagne BDM"
      SUPABASE_URL: http://studio:3000
      SUPABASE_ANON_KEY: ${STUDIO_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${STUDIO_SERVICE_KEY}
    ports:
      - "54323:3000"
    depends_on:
      - meta
    networks: [bdm]

networks:
  bdm:

volumes:
  db_data:
  app_vendor:
  app_node_modules:
