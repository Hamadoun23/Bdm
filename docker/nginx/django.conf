# nginx du conteneur Django : sert les fichiers immuables, délègue le reste.
#
# Les assets compilés par Vite portent un hachage dans leur nom : ils peuvent
# être mis en cache indéfiniment. Les médias téléversés, eux, gardent un cache
# court car un justificatif peut être remplacé.

# Résolveur DNS interne de Docker. nginx résout les noms d'hôte une seule fois,
# au démarrage : après une reconstruction, le conteneur Django reçoit une
# nouvelle adresse et nginx continue d'interroger l'ancienne — d'où un 502 à
# chaque déploiement. Le `valid=10s` force une réévaluation régulière.
resolver 127.0.0.11 valid=10s ipv6=off;

# Le nginx de l'hôte termine le TLS et transmet `X-Forwarded-Proto: https`.
# Ce second nginx est joint en HTTP simple : écraser l'en-tête avec `$scheme`
# ferait croire à Django que la requête est en clair — cookies non sécurisés,
# et URL absolues en http dans la table de routes envoyée au navigateur.
# On conserve donc la valeur d'origine, avec repli sur `$scheme`.
map $http_x_forwarded_proto $protocole_origine {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Assets Vite (hachés) et fichiers du socle.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pièces d'identité et autres fichiers téléversés.
    location /storage/ {
        alias /var/www/media/;
        access_log off;
        expires 1h;
        add_header Cache-Control "private";
    }

    location / {
        # Passer par une variable oblige nginx à résoudre le nom à chaque
        # requête, au lieu de figer l'adresse au démarrage.
        set $amont http://django:8000;
        proxy_pass $amont$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protocole_origine;
        # Les exports Excel complets peuvent prendre plusieurs dizaines de secondes.
        proxy_read_timeout 180s;
    }
}
