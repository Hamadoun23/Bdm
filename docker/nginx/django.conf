# nginx du conteneur Django : sert les fichiers immuables, délègue le reste.
#
# Les assets compilés par Vite portent un hachage dans leur nom : ils peuvent
# être mis en cache indéfiniment. Les médias téléversés, eux, gardent un cache
# court car un justificatif peut être remplacé.

upstream django {
    server django:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Assets Vite (hachés) et fichiers du socle.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Pièces d'identité et autres fichiers téléversés.
    location /storage/ {
        alias /var/www/media/;
        access_log off;
        expires 1h;
        add_header Cache-Control "private";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les exports Excel complets peuvent prendre plusieurs dizaines de secondes.
        proxy_read_timeout 180s;
    }
}
